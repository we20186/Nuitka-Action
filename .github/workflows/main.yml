name: Extreme Performance Nuitka Build

on:
  workflow_dispatch:
    inputs:
      entry_point:
        description: '入口 Python 文件 (如: main.py 或 video_sprites_gui_enhanced_v7_6.py)'
        required: true
        default: 'video_sprites_gui_enhanced_v7_6.py'
      icon_file:
        description: '图标文件 (如: exe.ico，留空则自动搜索 .ico)'
        required: false
        default: 'exe.ico'
      output_name:
        description: '生成的程序名称 (留空则使用入口文件名)'
        required: false
        default: ''
      build_mode:
        description: '打包模式 (onefile: 单文件, standalone: 单文件夹)'
        required: true
        default: 'onefile'
        type: choice
        options:
          - onefile
          - standalone

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Free Disk Space (Deep Cleanup)
        shell: pwsh
        run: |
          Write-Host "Starting deep cleanup to maximize disk space..."
          # 修复之前的报错：添加 SilentlyContinue
          Remove-TypeData * -ErrorAction SilentlyContinue
          
          $ErrorActionPreference = 'SilentlyContinue'
          # 移除大型预装组件（可腾出约 20GB+ 空间）
          Remove-Item -Recurse -Force "C:\Microsoft\AndroidSDK"
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\CodeQL"
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\Java_Temurin-Hotspot_jdk"
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\node"
          
          # 清理临时文件
          Remove-Item -Path "C:\Users\runneradmin\AppData\Local\Temp\*" -Recurse -Force
          
          [System.GC]::Collect()
          Write-Host "Disk cleanup successful."

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 显式安装打包辅助库
          pip install zstandard ordered-set
          # 安装项目依赖
          if (Test-Path "requirements.txt") { 
            pip install -r requirements.txt 
          } else {
            pip install PySide6 numpy opencv-python Pillow imageio imageio-ffmpeg rembg onnxruntime psutil
          }

      - name: Auto-Detect Files and UI Settings
        id: detect
        shell: pwsh
        run: |
          # 1. 入口文件检测
          $entry = "${{ github.event.inputs.entry_point }}"
          if (!(Test-Path $entry)) {
            $entry = Get-ChildItem -Filter "*.py" | Select-Object -First 1 -ExpandProperty Name
            Write-Host "Warning: Entry point not found, using: $entry"
          }

          # 2. 图标检测 (exe.ico -> 任何.ico -> 无)
          $icon = "${{ github.event.inputs.icon_file }}"
          if ($icon -eq "" -or !(Test-Path $icon)) {
            if (Test-Path "exe.ico") { $icon = "exe.ico" }
            else { 
              $foundIcon = Get-ChildItem -Filter "*.ico" | Select-Object -First 1 -ExpandProperty Name
              if ($foundIcon) { $icon = $foundIcon } else { $icon = "" }
            }
          }

          # 3. 程序名称
          $name = "${{ github.event.inputs.output_name }}"
          if ($name -eq "") { $name = [System.IO.Path]::GetFileNameWithoutExtension($entry) }

          echo "entry=$entry" >> $env:GITHUB_OUTPUT
          echo "icon=$icon" >> $env:GITHUB_OUTPUT
          echo "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "Ready to build: $name using $entry with icon $icon"

      - name: Nuitka Cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: ${{ steps.detect.outputs.entry }}
          output-file: ${{ steps.detect.outputs.name }}
          onefile: ${{ github.event.inputs.build_mode == 'onefile' }}
          standalone: ${{ github.event.inputs.build_mode == 'standalone' }}
          # 自动应用图标到所有位置
          windows-icon-from-ico: ${{ steps.detect.outputs.icon }}
          # 针对 PySide6 和 AI 库的优化参数
          nuitka-arguments: |
            --jobs=${{ env.NUMBER_OF_PROCESSORS }}
            --enable-plugin=pyside6
            --windows-disable-console
            --include-package=rembg
            --include-package=onnxruntime
            --collect-submodules=rembg
            --assume-yes-for-downloads
            --onefile-tempdir-spec="{CACHE_DIR}/${{ steps.detect.outputs.name }}/v1"
            --output-dir=build
          # 这里的 jobs 利用多核 CPU，zstandard 自动被 Nuitka 调用进行压缩

      - name: Post-Build Cleanup
        shell: pwsh
        run: |
          # 移除构建产生的庞大临时目录以释放空间以便上传
          $buildDir = "build/${{ steps.detect.outputs.name }}.build"
          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir }
          pip cache purge

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.name }}-Binary
          path: |
            build/*.exe
            build/*.dist
          retention-days: 7
